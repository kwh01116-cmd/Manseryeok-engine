<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사주 리포트 읽기 연구</title>
<link rel="stylesheet" href="/base.css"><link rel="stylesheet" href="/study.css">
<script type="module" src="/study.js"></script>
</head>
<body>
<a class="skip-link" href="#main">본문으로</a>
<div class="shell">
<header class="site-header"><span class="brand"><span class="brand-mark" aria-hidden="true">書</span> 사주 리포트 읽기 연구</span><span class="test-chip">내부 모의 평가</span></header>
<main id="main" class="screen" tabindex="-1">
<div id="notice" role="status" aria-live="polite"></div><div id="error" role="alert"></div>
<section id="welcome" aria-labelledby="welcome-title">
<div class="hero"><div><h1 id="welcome-title">어느 문장에서<br>이 명식의 특징이 읽히나요?</h1>
<p class="hero-description">가상의 출생 사례로 만든 글을 읽습니다. 사례를 이해하는 데 도움이 된 설명과, 다른 사람에게도 그대로 쓸 수 있을 것 같은 설명을 짚어 주세요.</p></div>
<form id="enter" class="panel"><h2>배정받은 평가 열기</h2><label class="field">초대 코드<input id="invite" type="password" autocomplete="off" required maxlength="192" spellcheck="false"></label>
<button class="primary" id="enter-btn">평가 열기</button><p class="fine">지금은 가상 명식으로 도구를 점검하는 단계입니다. 실제 이름과 출생정보는 입력하지 마세요.</p></form></div>
</section>
<div id="workspace"></div>
</main>
<footer class="site-footer">가상 명식 연구 · 외부 전송과 실결제 없음</footer>
</div>
</body></html>
