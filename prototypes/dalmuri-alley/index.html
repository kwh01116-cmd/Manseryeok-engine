<title>달무리 골목</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one fixed-seat stage. A night alley strip of lit booths; pick one and the view
   becomes the customer's seat: reader above, table with cards in the middle, dialogue below. */
:root {
  color-scheme: dark;
  --night: #0c0a1d;
  --plum: #24103f;
  --ink: #150e28;
  --violet: #b455ff;
  --lime: #e6ff3d;
  --bulb: #ffd98a;
  --red: #e8322f;
  --paper: #fff4dc;
  --jade: #1f9a7a;
  --gold: #e2b659;
  --crimson: #8e1b2e;
  --f-sign: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-label: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  background: var(--night);
  color: var(--paper);
  font-family: var(--f-body);
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.stage {
  position: relative;
  height: 100%;
  min-height: 540px;
  overflow: hidden;
  container-type: size;
  background: var(--night);
}
.scene {
  position: absolute;
  inset: 0;
  transition: opacity .55s ease, transform .7s ease, visibility 0s;
}
.scene[aria-hidden="true"] {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .55s ease, transform .7s ease, visibility 0s .55s;
}

/* ───────────── 골목 ───────────── */
.alley { display: flex; flex-direction: column; }
.alley[aria-hidden="true"] { transform: scale(1.14); }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; }
.alley::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 13cqh;
  background:
    repeating-linear-gradient(90deg, transparent 0 118px, rgba(255, 244, 220, .05) 118px 120px),
    linear-gradient(#1d1638, #07060f);
  border-top: 2px solid #2c2350;
}
.alley-head {
  position: relative;
  z-index: 2;
  padding-top: clamp(14px, 3cqh, 30px);
}
.alley-head h1 {
  margin: 0;
  font-family: var(--f-sign);
  font-weight: 400;
  font-size: clamp(30px, 6.4cqw, 54px);
  line-height: 1.05;
  color: var(--lime);
  text-shadow: 0 0 18px rgba(180, 85, 255, .9), 0 0 2px #fff;
}
.alley-head p {
  margin: 6px 0 0;
  font-family: var(--f-label);
  font-size: clamp(14px, 2.2cqw, 17px);
  color: var(--bulb);
}
.strip {
  position: relative;
  z-index: 2;
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: flex-end;
  gap: clamp(18px, 5cqw, 56px);
  padding-top: 12px;
  padding-bottom: 13cqh;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
}
.strip::-webkit-scrollbar { display: none; }

.booth {
  --glow: var(--violet);
  position: relative;
  flex: 0 0 auto;
  width: min(80cqw, 430px);
  display: flex;
  flex-direction: column;
  padding: 0;
  border: 0;
  background: none;
  text-align: left;
  scroll-snap-align: center;
  transition: transform .25s ease, filter .25s ease;
}
.booth:first-child { margin-left: auto; }
.booth:last-child { margin-right: auto; }
.booth::after {
  content: "";
  position: absolute;
  left: 4%; right: 4%; top: calc(100% + 12px);
  height: 10cqh;
  background: linear-gradient(var(--glow), transparent 85%);
  filter: blur(9px);
  opacity: .34;
  pointer-events: none;
}
.booth.open:hover, .booth.open:focus-visible { transform: translateY(-4px); filter: brightness(1.08); }

.sb {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  min-height: clamp(70px, 13cqh, 104px);
  padding: 8px 16px 10px;
  border-radius: 10px 10px 0 0;
  border: 3px solid #d79bff;
  border-bottom-width: 0;
  background:
    radial-gradient(circle at 12px 12px, rgba(255, 255, 255, .16) 0 2px, transparent 3px) 0 0 / 24px 24px,
    linear-gradient(#3b2bd1, #2a1a9a);
  box-shadow: 0 0 26px rgba(180, 85, 255, .65);
}
.sb-sub {
  font-family: var(--f-label);
  font-size: clamp(12px, 3.2cqw, 15px);
  color: #fff;
  letter-spacing: .08em;
}
.sb-main {
  font-family: var(--f-sign);
  font-size: min(11cqw, 56px);
  line-height: 1;
  color: var(--lime);
  -webkit-text-stroke: 6px #1a1160;
  paint-order: stroke fill;
  white-space: nowrap;
}
.bd {
  display: flex;
  height: clamp(190px, 36cqh, 310px);
  background: #17141f;
  border: 3px solid #2a2634;
}
.signs {
  flex: 0 0 31%;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 6px 5px;
  background: #0f0d16;
}
.sg {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  font-family: var(--f-label);
  font-size: clamp(11px, 2.9cqw, 14px);
  line-height: 1.15;
  text-align: center;
  color: var(--ink);
  box-shadow: 0 0 10px rgba(255, 255, 255, .25);
}
.sg b { font-family: var(--f-sign); font-weight: 400; font-size: 1.5em; }
.sg small { font-size: .9em; }
.sg.y { background: #ffee4d; }
.sg.r { background: var(--red); color: #fff; }
.sg.r b { color: #ffee4d; }
.sg.w { background: #f4f7ff; }
.sg.p { background: #b23cf0; color: #fff; }
.sg.p b { color: var(--lime); }
.win {
  position: relative;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  background: #1a1550;
}
.win svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.win::before { /* 알전구 */
  content: "";
  position: absolute;
  left: 0; right: 0; top: 2px;
  height: 20px;
  z-index: 2;
  background: radial-gradient(circle, #fffbe6 0 4px, rgba(255, 217, 138, .7) 5px, transparent 10px) 0 0 / 32px 20px repeat-x;
}
.win::after { /* 비닐 천막 */
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  background:
    linear-gradient(90deg, transparent 49.4%, rgba(255, 255, 255, .28) 49.6% 50.2%, transparent 50.6%),
    linear-gradient(104deg, transparent 12%, rgba(255, 255, 255, .13) 17%, transparent 24%, transparent 62%, rgba(255, 255, 255, .1) 68%, transparent 74%),
    radial-gradient(120% 70% at 50% 0, rgba(255, 217, 138, .34), transparent 70%);
  pointer-events: none;
}
.enter {
  position: absolute;
  z-index: 4;
  left: 50%; bottom: 10px;
  transform: translateX(-50%);
  padding: 6px 16px 5px;
  border-radius: 999px;
  background: var(--lime);
  color: var(--ink);
  font-family: var(--f-label);
  font-size: 15px;
  white-space: nowrap;
  box-shadow: 0 0 16px rgba(230, 255, 61, .7);
}
.chassis {
  position: relative;
  height: 14px;
  background: #1b1826;
  border-radius: 0 0 4px 4px;
}
.chassis::before {
  content: "";
  position: absolute;
  left: 9%; top: 2px;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: radial-gradient(circle, #8d8a96 0 5px, #2b2833 6px 9px, #0d0c12 10px);
}

.booth.closed { --glow: #5a5670; cursor: default; }
.booth.closed .sb { filter: saturate(.2) brightness(.5); box-shadow: none; }
.booth.closed .signs { filter: saturate(.15) brightness(.42); }
.booth.closed .win { background: repeating-linear-gradient(#23202e 0 11px, #191622 11px 13px); }
.booth.closed .win::before, .booth.closed .win::after { display: none; }
.note {
  position: absolute;
  left: 50%; top: 50%;
  width: min(78%, 190px);
  transform: translate(-50%, -50%) rotate(-3deg);
  padding: 12px 10px 10px;
  background: #e9e1cd;
  color: var(--ink);
  text-align: center;
  font-family: var(--f-label);
  font-size: 13px;
  line-height: 1.35;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .5);
}
.note b { display: block; font-family: var(--f-sign); font-weight: 400; font-size: 26px; color: var(--red); }

.proto {
  position: absolute;
  z-index: 3;
  left: 0; right: 0;
  bottom: max(10px, env(safe-area-inset-bottom, 0px));
  margin: 0;
  font-size: 12px;
  text-align: center;
  color: rgba(255, 244, 220, .62);
}
.toast {
  position: absolute;
  z-index: 5;
  left: 50%; bottom: 15cqh;
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-label);
  font-size: 15px;
  text-align: center;
  box-shadow: 0 6px 22px rgba(0, 0, 0, .6);
}

/* ───────────── 부스 안 ───────────── */
.room {
  --tt: 50cqh;                       /* 테이블 윗선 */
  --card-h: min(17.5cqh, 36cqw);
  --card-w: calc(var(--card-h) / 1.55);
  background: #151042;
}
.room[aria-hidden="true"] { transform: scale(.94); }
.wall {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle, rgba(255, 244, 220, .85) 0 1px, transparent 1.6px) 14px 22px / 92px 76px,
    radial-gradient(circle, rgba(226, 182, 89, .8) 0 1.3px, transparent 2px) 50px 60px / 138px 112px,
    radial-gradient(90% 60% at 50% 12%, #2d2390, #151042 72%);
}
.room::before, .room::after { /* 양옆 비닐 */
  content: "";
  position: absolute;
  z-index: 1;
  top: 0; bottom: 0;
  width: 8cqw;
  background: linear-gradient(90deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .03) 55%, rgba(255, 255, 255, .12) 70%, transparent);
  pointer-events: none;
}
.room::before { left: 0; }
.room::after { right: 0; transform: scaleX(-1); }
.awning {
  position: absolute;
  z-index: 5;
  left: 0; right: 0; top: 0;
  height: clamp(44px, 7cqh, 60px);
  background: linear-gradient(#3b2bd1, #2a1a9a);
  border-bottom: 3px solid #d79bff;
  box-shadow: 0 6px 30px rgba(255, 217, 138, .28);
}
.awning::after {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 100%;
  height: 30px;
  background: radial-gradient(circle, #fffbe6 0 6px, rgba(255, 217, 138, .75) 7px, transparent 15px) 0 0 / 58px 30px repeat-x;
}
.wallpaper { display: none; }
@container (min-width: 720px) {
  .wallpaper {
    display: block;
    position: absolute;
    z-index: 1;
    top: 20cqh;
    width: 168px;
    word-break: keep-all;
    padding: 12px 12px 10px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--f-label);
    font-size: 14px;
    line-height: 1.5;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
  }
  .wallpaper b { display: block; font-family: var(--f-sign); font-weight: 400; font-size: 20px; color: var(--red); }
  .wallpaper.l { left: calc(50% - 26cqh - 210px); transform: rotate(-2.5deg); }
  .wallpaper.r { left: calc(50% + 26cqh + 42px); transform: rotate(2deg); }
}

.reader {
  position: absolute;
  z-index: 2;
  left: 50%;
  bottom: calc(100cqh - var(--tt) - 1cqh);
  height: 42cqh;
  aspect-ratio: 360 / 420;
  transform: translateX(-50%);
}
.halo {
  position: absolute;
  left: 50%; top: 40%;
  width: 138%;
  transform: translate(-50%, -50%);
  color: var(--gold);
}
.char { position: absolute; inset: 0; width: 100%; height: 100%; animation: bob 4.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-1.1%); } }
.char .m, .char .eyes-smile { display: none; }
.reader[data-mood="neutral"] .m-neutral,
.reader[data-mood="think"] .m-neutral,
.reader[data-mood="smile"] .m-smile,
.reader[data-mood="surprise"] .m-o { display: block; }
.reader[data-mood="smile"] .eyes-open { display: none; }
.reader[data-mood="smile"] .eyes-smile { display: block; }
.char .brows { transition: transform .25s ease; transform-box: fill-box; transform-origin: center; }
.reader[data-mood="think"] .brows { transform: translateY(-3px) rotate(-2deg); }
.reader[data-mood="surprise"] .brows { transform: translateY(-7px); }
.reader.talking .m { display: none; }
.reader.talking .m-talk { display: block; transform-box: fill-box; transform-origin: center; animation: talk .3s steps(2, jump-none) infinite; }
@keyframes talk { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
.char .eyes-open { transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(.08); } }

.table {
  position: absolute;
  z-index: 3;
  left: 0; right: 0;
  top: var(--tt);
  bottom: 0;
  background:
    radial-gradient(80% 60% at 50% 0, rgba(255, 217, 138, .22), transparent 70%),
    linear-gradient(#a52238, var(--crimson) 46%, #4d0d1b);
  box-shadow: 0 -8px 26px rgba(0, 0, 0, .45);
}
.table::before { /* 금박 테두리 */
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 12px;
  background:
    repeating-linear-gradient(90deg, transparent 0 14px, rgba(142, 27, 46, .75) 14px 18px),
    linear-gradient(#f5d58a, var(--gold));
}
.spread {
  position: absolute;
  left: 0; right: 0;
  top: calc(12px + 2.4cqh);
  height: calc(var(--card-h) + 40px);
}

/* 카드 */
.card {
  display: block;
  width: var(--card-w);
  height: var(--card-h);
  padding: 0;
  border: 0;
  background: none;
  perspective: 700px;
}
.card-in {
  position: relative;
  display: block;
  width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform .75s cubic-bezier(.2, .7, .2, 1);
}
.card.flipped .card-in { transform: rotateY(180deg); }
.back, .face {
  position: absolute;
  inset: 0;
  border-radius: calc(var(--card-h) * .055);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .45);
}
.back {
  border: 2px solid var(--gold);
  background:
    radial-gradient(circle at 50% 50%, var(--gold) 0 11%, transparent 12%),
    radial-gradient(circle at 58% 46%, #231a70 0 11%, transparent 12%),
    repeating-linear-gradient(45deg, transparent 0 7px, rgba(226, 182, 89, .32) 7px 8px),
    repeating-linear-gradient(-45deg, transparent 0 7px, rgba(226, 182, 89, .32) 7px 8px),
    #231a70;
}
.face {
  transform: rotateY(180deg);
  background: var(--paper);
  border: 2px solid var(--gold);
  color: #231a70;
}
.face-in {
  position: absolute;
  inset: 4%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 5% 2% 6%;
  border: 1px solid rgba(35, 26, 112, .45);
  border-radius: calc(var(--card-h) * .035);
}
.face.rev .face-in { transform: rotate(180deg); }
.face .num { font-family: var(--f-label); font-style: normal; font-size: calc(var(--card-h) * .095); line-height: 1; color: var(--red); }
.face svg { width: 74%; flex: 0 1 auto; min-height: 0; }
.face .nm {
  font-family: var(--f-label);
  font-weight: 400;
  font-size: calc(var(--card-h) * .1);
  line-height: 1.08;
  text-align: center;
  word-break: keep-all;
}

.deck { position: absolute; left: 50%; top: 0; width: var(--card-w); height: var(--card-h); transform: translateX(-50%); }
.deck .card { position: absolute; inset: 0; }
.deck .card:nth-child(odd) { animation: riffle-l .42s ease-in-out 4 alternate; }
.deck .card:nth-child(even) { animation: riffle-r .42s ease-in-out 4 alternate; }
@keyframes riffle-l { to { transform: translateX(-62%) rotate(-7deg); } }
@keyframes riffle-r { to { transform: translateX(62%) rotate(7deg); } }

.fan {
  position: absolute;
  left: 50%; top: 0;
  width: min(88cqw, 620px);
  height: var(--card-h);
  transform: translateX(-50%);
}
.fan .card {
  position: absolute;
  top: 0;
  left: calc(var(--i) * (100% - var(--card-w)) / 8);
  transform: translateY(var(--dy)) rotate(var(--rot));
  transition: transform .3s ease, opacity .35s ease;
  animation: deal .45s ease backwards;
  animation-delay: calc(var(--i) * 45ms);
}
.fan .card:hover, .fan .card:focus-visible { transform: translateY(calc(var(--dy) - 12%)) rotate(var(--rot)); z-index: 2; }
.fan .card.gone { transform: translateY(-70%) rotate(var(--rot)); opacity: 0; pointer-events: none; }
@keyframes deal { from { opacity: 0; transform: translateY(40%); } }

.slots { display: flex; justify-content: center; gap: min(5cqw, 34px); }
.slot { display: flex; flex-direction: column; align-items: center; gap: 5px; animation: deal .5s ease backwards; }
.slot:nth-child(2) { animation-delay: .12s; }
.slot:nth-child(3) { animation-delay: .24s; }
.slot .card { transition: transform .35s ease, filter .35s ease; }
.slot.active .card { transform: translateY(-5%) scale(1.1); filter: drop-shadow(0 0 12px rgba(255, 217, 138, .85)); }
.cap {
  font-family: var(--f-label);
  font-size: 13px;
  line-height: 1.2;
  color: var(--bulb);
  text-align: center;
  word-break: keep-all;
  max-width: calc(var(--card-w) + 5cqw);
}

/* HUD · 대화창 */
.hud {
  position: absolute;
  z-index: 7;
  left: 0; right: 0;
  top: max(8px, env(safe-area-inset-top, 0px));
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.pill {
  padding: 7px 13px 6px;
  border-radius: 999px;
  border: 1.5px solid rgba(255, 244, 220, .5);
  background: rgba(21, 14, 40, .78);
  font-family: var(--f-label);
  font-size: 14px;
  line-height: 1;
}
.pill:hover { background: rgba(21, 14, 40, .95); border-color: var(--paper); }
.pill:disabled { opacity: .55; cursor: default; }

.dlg-wrap {
  position: absolute;
  z-index: 6;
  left: 0; right: 0;
  bottom: max(14px, env(safe-area-inset-bottom, 0px));
}
.dlg {
  position: relative;
  max-width: 680px;
  min-height: clamp(128px, 19cqh, 168px);
  margin: 0 auto;
  padding: 26px 18px 16px;
  border-radius: 14px;
  border: 1.5px solid rgba(226, 182, 89, .6);
  background: rgba(21, 14, 40, .93);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
}
.who {
  position: absolute;
  left: 14px; top: -15px;
  padding: 3px 12px 2px;
  border-radius: 7px;
  background: var(--lime);
  color: var(--ink);
  font-family: var(--f-sign);
  font-size: 18px;
  transform: rotate(-2deg);
  box-shadow: 0 0 14px rgba(230, 255, 61, .5);
}
.line {
  margin: 0;
  min-height: 3.2em;
  font-size: clamp(16px, 2.3cqw, 18px);
  line-height: 1.62;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.next {
  position: absolute;
  right: 10px; bottom: 6px;
  padding: 6px 8px;
  border: 0;
  background: none;
  color: var(--lime);
  font-size: 15px;
  animation: nudge 1s ease-in-out infinite;
}
@keyframes nudge { 50% { transform: translateY(4px); } }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.opts:empty { display: none; }
.opt {
  min-height: 44px;
  padding: 8px 10px 7px;
  border-radius: 11px;
  border: 2px solid var(--ink);
  font-family: var(--f-label);
  font-size: 16px;
  line-height: 1.15;
  color: var(--ink);
  box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .5), 0 0 12px rgba(255, 255, 255, .18);
  transition: transform .15s ease;
}
.opt:hover { transform: translateY(-2px); }
.opt:nth-child(4n+1) { background: #ffee4d; }
.opt:nth-child(4n+2) { background: var(--red); color: #fff; }
.opt:nth-child(4n+3) { background: #f4f7ff; }
.opt:nth-child(4n+4) { background: #b23cf0; color: #fff; }

/* ═════════ 음성 어댑터 ═════════
   지금은 브라우저 내장 음성. 실제 앱에서는 speak()를 ElevenLabs 스트리밍 호출로 바꾸면 됩니다. */
const Voice = (() => {
  const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
  let voice = null, on = true, speaking = false, onChange = () => {};
  try { on = localStorage.getItem('dalmuri-sound') !== 'off'; } catch (e) { /* 저장소 없음 */ }
  const pick = () => {
    if (!synth) return;
    const vs = synth.getVoices().filter(v => /^ko/i.test(v.lang));
    voice = vs.find(v => /yuna|sunhi|heami|google/i.test(v.name)) || vs[0] || null;
  };
  if (synth) { pick(); if (synth.addEventListener) synth.addEventListener('voiceschanged', pick); }
  return {
    get available() { return !!synth; },
    get on() { return on && !!synth; },
    get speaking() { return speaking; },
    watch(fn) { onChange = fn; },
    set(v) { on = v; try { localStorage.setItem('dalmuri-sound', v ? 'on' : 'off'); } catch (e) { /* 무시 */ } if (!v) this.stop(); },
    speak(text) {
      if (!synth || !on) return;
      try {
        synth.cancel();
        const u = new SpeechSynthesisUtterance(text.replace(/[「」]/g, ' '));
        u.lang = 'ko-KR'; if (voice) u.voice = voice; u.rate = 1.03; u.pitch = 1.08;
        u.onstart = () => { speaking = true; onChange(); };
        u.onend = u.onerror = () => { speaking = false; onChange(); };
        synth.speak(u);
      } catch (e) { speaking = false; }
    },
    stop() { if (synth) { try { synth.cancel(); } catch (e) { /* 무시 */ } } speaking = false; onChange(); },
  };
})();

/* ═════════ 요소 ═════════ */
const alley = $('#alley'), room = $('#room'), reader = $('#reader'), spread = $('#spread');
const lineEl = $('#line'), liveEl = $('#live'), optsEl = $('#opts'), nextBtn = $('#next'), dlg = $('#dlg');
const soundBtn = $('#sound'), toast = $('#toast');
const state = { call: '손님', topic: 'flow', q: '' };

/* ═════════ 흐름 제어: 중간에 나가면 진행 중인 대기를 끊는다 ═════════ */
class Stop extends Error {}
let pending = null;
const ui = { typing: false, finishTyping: null, onAdvance: null };
function wait(setup) {
  return new Promise((resolve, reject) => {
    let cleanup = null;
    const p = { reject(e) { if (cleanup) cleanup(); reject(e); } };
    pending = p;
    cleanup = setup(v => { if (pending === p) pending = null; resolve(v); }) || null;
  });
}
function cancelAll() {
  const p = pending; pending = null;
  ui.typing = false; ui.finishTyping = null; ui.onAdvance = null;
  if (p) p.reject(new Stop());
}
const sleep = ms => wait(done => { const t = setTimeout(done, reduced ? Math.min(ms, 60) : ms); return () => clearTimeout(t); });

const syncTalk = () => reader.classList.toggle('talking', ui.typing || Voice.speaking);
Voice.watch(syncTalk);
const mood = m => { reader.dataset.mood = m; };

function type(text, m) {
  if (m) mood(m);
  optsEl.replaceChildren();
  nextBtn.hidden = true;
  return wait(done => {
    let i = 0;
    lineEl.textContent = '';
    liveEl.textContent = text;
    ui.typing = true;
    Voice.speak(text);
    syncTalk();
    const finish = () => {
      clearInterval(t);
      lineEl.textContent = text;
      ui.typing = false; ui.finishTyping = null;
      syncTalk();
      done();
    };
    const t = setInterval(() => { i++; lineEl.textContent = text.slice(0, i); if (i >= text.length) finish(); }, reduced ? 1 : 40);
    ui.finishTyping = finish;
    return () => clearInterval(t);
  });
}
const waitAdvance = () => wait(done => {
  nextBtn.hidden = false;
  ui.onAdvance = () => { nextBtn.hidden = true; done(); };
});
async function say(text, m) { await type(text, m); await waitAdvance(); }
function advance() {
  if (ui.typing && ui.finishTyping) ui.finishTyping();
  else if (ui.onAdvance) { const f = ui.onAdvance; ui.onAdvance = null; f(); }
}

async function choose(text, options, m) {
  await type(text, m);
  return wait(done => {
    options.forEach(([label, value]) => {
      const b = el('button', 'opt'); b.type = 'button'; b.textContent = label;
      b.addEventListener('click', () => { optsEl.replaceChildren(); done(value); });
      optsEl.append(b);
    });
    const first = optsEl.querySelector('button'); if (first) first.focus({ preventScroll: true });
  });
}
async function askText(text, placeholder, skipLabel, m) {
  await type(text, m);
  return wait(done => {
    const form = el('form', 'ask');
    form.innerHTML = `<input id="answer" type="text" maxlength="40" autocomplete="off" aria-label="${placeholder}" placeholder="${placeholder}"><button class="opt" type="submit">말하기</button><button class="opt" type="button">${skipLabel}</button>`;
    const input = $('input', form);
    const finish = v => { optsEl.replaceChildren(); done(v); };
    form.addEventListener('submit', e => { e.preventDefault(); finish(input.value.trim()); });
    form.lastElementChild.addEventListener('click', () => finish(''));
    optsEl.append(form);
  });
}

/* ═════════ 카드 ═════════ */
const backHTML = '<span class="card-in"><span class="back"></span></span>';
function shuffleDeck() {
  const a = CARDS.map((_, i) => i);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
async function riffle() {
  const deck = el('div', 'deck');
  for (let i = 0; i < 4; i++) deck.append(el('span', 'card', backHTML));
  spread.replaceChildren(deck);
  await sleep(1750);
}
function pickThree() {
  return wait(done => {
    const order = shuffleDeck(), picks = [];
    const fan = el('div', 'fan');
    const count = el('p', 'count', '고른 카드 0 / 3');
    for (let i = 0; i < 9; i++) {
      const b = el('button', 'card', backHTML);
      b.type = 'button';
      b.setAttribute('aria-label', `뒤집힌 카드 ${i + 1}`);
      b.style.setProperty('--i', i);
      b.style.setProperty('--rot', ((i - 4) * 3.2) + 'deg');
      b.style.setProperty('--dy', ((i - 4) ** 2 * 0.9) + '%');
      b.addEventListener('click', () => {
        if (picks.length >= 3 || b.classList.contains('gone')) return;
        b.classList.add('gone'); b.disabled = true;
        const num = order[picks.length];
        picks.push({ num, c: CARDS[num], rev: Math.random() < 0.3 });
        count.textContent = `고른 카드 ${picks.length} / 3`;
        if (picks.length === 3) setTimeout(() => { optsEl.replaceChildren(); done(picks); }, 450);
      });
      fan.append(b);
    }
    spread.replaceChildren(fan);
    optsEl.replaceChildren(count);
  });
}
function layOut(picks) {
  const row = el('div', 'slots');
  picks.forEach((p, i) => {
    const slot = el('div', 'slot');
    const card = el('div', 'card', `<span class="card-in"><span class="back"></span><span class="face${p.rev ? ' rev' : ''}"><span class="face-in"><i class="num">${ROMAN[p.num]}</i>${svg(p.c.icon)}<b class="nm">${p.c.n}</b></span></span></span>`);
    const cap = el('span', 'cap', POS[i].cap);
    slot.append(card, cap);
    row.append(slot);
    p.slot = slot; p.card = card; p.cap = cap;
  });
  spread.replaceChildren(row);
}
const spotlight = (picks, i) => picks.forEach((p, k) => p.slot.classList.toggle('active', k === i));

/* ═════════ 대본 ═════════
   지금은 고정 대본. 실제 앱에서는 reading()이 뽑힌 카드와 질문을 LLM에 넘기고,
   say()가 받을 문장을 스트리밍으로 받아오게 됩니다. */
const ACK = {
  love: '사람 일이구나. 표정 보니까 대충 알겠다. 누구 얘긴지는 말 안 해도 돼요. 카드가 알아서 짚어 주니까.',
  work: '먹고사는 문제구나. 그게 제일 무겁지. 자, 어깨 힘부터 좀 빼요.',
  flow: '딱 꼬집어 하나는 아니고 그냥 답답한 거구나. 그런 날이 카드 보기 제일 좋아요.',
};
const TOPIC = {
  love: '사람 일로 물었잖아요.',
  work: '일이랑 돈 문제로 물었죠.',
  flow: '딱 하나를 묻진 않았지만 흐름은 보여요.',
  custom: '아까 그 고민 있잖아요.',
};
const REVS = [
  '세 장이 다 바로 섰어요. 흐름이 막힌 데 없이 이어져 있다는 거예요.',
  '한 장이 거꾸로 섰죠. 전체는 괜찮은데 거기 한 군데가 걸려 있는 거예요.',
  '거꾸로 선 카드가 많아요. 나쁜 게 아니고, 기운이 밖으로 못 나가고 안에서 맴돈다는 뜻이에요.',
];

async function reading() {
  const t = await choose(`${state.call}, 오늘은 뭐가 제일 마음에 걸려서 왔어요?`,
    [['연애 · 사람', 'love'], ['일 · 돈', 'work'], ['요즘 흐름 전반', 'flow'], ['직접 말할게요', 'custom']], 'neutral');
  state.topic = t;
  if (t === 'custom') {
    state.q = await askText('그래요, 편하게 말해 봐요. 한 줄이면 돼요.', '예: 이직해도 될까요', '말로는 못 하겠어요', 'smile');
    await say(state.q ? `「${state.q}」. 그게 마음에 걸렸구나. 그 생각 그대로 붙들고 있어요.` : '말로 안 나오는 고민도 있죠. 속으로만 떠올리고 있어요.', 'think');
  } else {
    await say(ACK[t], 'think');
  }

  await type('카드 섞을게요. 섞는 동안 그 질문만 속으로 한 번 더 되뇌어 봐요.', 'neutral');
  await riffle();
  await type('자, 펼쳤어요. 손 가는 대로 세 장만 골라요. 오래 고민하면 안 맞아요.', 'smile');
  const picks = await pickThree();
  layOut(picks);
  await say('이 세 장이구나. 왼쪽부터 지나온 것, 지금, 다가올 것이에요. 하나씩 뒤집어 볼게요.', 'neutral');

  for (let i = 0; i < 3; i++) {
    const p = picks[i];
    spotlight(picks, i);
    p.card.classList.add('flipped');
    p.cap.innerHTML = `${POS[i].cap}<br>${p.c.n}${p.rev ? ' (역)' : ''}`;
    await sleep(700);
    await say(`${POS[i].intro} ${p.c.n} 카드${p.rev ? ', 거꾸로 섰네요' : '네요'}.`, HEAVY.has(p.num) && !p.rev ? 'surprise' : 'neutral');
    await say(p.rev ? p.c.rev : p.c.up, 'neutral');
    await say(POS[i].frame, 'think');
  }
  spotlight(picks, -1);

  const nRev = picks.filter(p => p.rev).length;
  await say(REVS[Math.min(nRev, 2)], 'think');
  await say(`${TOPIC[t]} 지나온 자리에 ${picks[0].c.n}, 지금은 ${picks[1].c.n}, 앞에는 ${picks[2].c.n}. 이 순서로 이야기가 흘러가고 있어요.`, 'neutral');
  await say(`마지막 카드가 하는 말은 이거예요. ${picks[2].c.tip}`, 'smile');
  await say('카드는 정해진 걸 통보하는 게 아니에요. 지금 서 있는 자리를 비춰 주는 거지. 마음에 걸리는 말 하나만 들고 가요.', 'neutral');
  await say('복채는 오천 원인데, 아직 개업 전이라 오늘은 그냥 가요.', 'smile');
}

async function session() {
  try {
    await sleep(650);
    await say('어서 와요. 비 오는데 용케 찾아왔네. 거기 편하게 앉아요.', 'smile');
    await say('나는 달무리예요. 이 골목에서 카드만 스무 해 넘게 폈어요.', 'neutral');
    const name = await askText('이름이 뭐예요? 부르고 싶은 대로 알려 줘요.', '이름 또는 별명', '그냥 손님으로', 'smile');
    state.call = name ? `${name} 씨` : '손님';
    await say(name ? `${state.call}. 이름 좋네, 입에 잘 붙어요.` : '말 안 해도 돼요. 그럼 그냥 손님이라고 부를게요.', 'smile');
    for (;;) {
      await reading();
      const more = await choose('더 볼 거 있어요?', [['한 번 더 볼래요', 'again'], ['골목으로 나갈게요', 'leave']], 'neutral');
      if (more === 'leave') {
        await say('그래요. 우산 챙기고, 비 그치면 또 와요.', 'smile');
        leave();
        return;
      }
      spread.replaceChildren();
      await say('좋아요. 다른 걸 물어도 되고, 같은 걸 다시 물어도 돼요.', 'smile');
    }
  } catch (e) {
    if (!(e instanceof Stop)) throw e;
  }
}

/* ═════════ 장면 전환 ═════════ */
function show(scene, on) { scene.setAttribute('aria-hidden', on ? 'false' : 'true'); scene.inert = !on; }
function enter() {
  cancelAll();
  spread.replaceChildren(); optsEl.replaceChildren(); lineEl.textContent = ''; nextBtn.hidden = true; mood('neutral');
  show(alley, false); show(room, true);
  session();
}
function leave() {
  cancelAll(); Voice.stop();
  show(room, false); show(alley, true);
  $('#booth-tarot').focus({ preventScroll: true });
}

$('#booth-tarot').addEventListener('click', enter);
let toastTimer = 0;
$('#booth-saju').addEventListener('click', () => {
  toast.textContent = '보름달 사주는 아직 준비중이에요. 오늘은 달무리 타로만 불이 켜져 있어요.';
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 3200);
});
$('#exit').addEventListener('click', leave);
nextBtn.addEventListener('click', e => { e.stopPropagation(); advance(); });
dlg.addEventListener('click', e => { if (!e.target.closest('button, input, form')) advance(); });
document.addEventListener('keydown', e => {
  if (room.inert || (e.key !== 'Enter' && e.key !== ' ')) return;
  if (e.target.closest('button, input, form')) return;
  e.preventDefault(); advance();
});

function paintSound() {
  if (!Voice.available) { soundBtn.textContent = '음성 없음'; soundBtn.disabled = true; return; }
  soundBtn.textContent = Voice.on ? '소리 켬' : '소리 끔';
  soundBtn.setAttribute('aria-pressed', String(Voice.on));
}
soundBtn.addEventListener('click', () => { Voice.set(!Voice.on); paintSound(); });
paintSound();
show(room, false);

})();

/* ═════════ 골목 하늘: 건물 불빛 + 비 ═════════ */
(() => {
  const c = $('#sky'), ctx = c.getContext('2d');
  let W = 0, H = 0, d = 1, bg = null, drops = [], raf = 0;
  const rng = seed => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  function paintBg() {
    bg = document.createElement('canvas'); bg.width = W; bg.height = H;
    const g = bg.getContext('2d'), r = rng(7);
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#07061a'); sky.addColorStop(.6, '#1b1242'); sky.addColorStop(1, '#0c0a1d');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    const base = H * .9;
    for (let x = -20 * d; x < W;) {
      const w = (56 + r() * 96) * d, h = H * (.3 + r() * .42);
      g.fillStyle = r() > .5 ? '#100d27' : '#141033';
      g.fillRect(x, base - h, w, h);
      for (let wy = base - h + 12 * d; wy < base - 40 * d; wy += 15 * d) {
        for (let wx = x + 8 * d; wx < x + w - 10 * d; wx += 13 * d) {
          const k = r();
          if (k < .2) { g.fillStyle = k < .13 ? 'rgba(255,217,138,.55)' : 'rgba(170,190,255,.4)'; g.fillRect(wx, wy, 6 * d, 8 * d); }
        }
      }
      x += w + (2 + r() * 10) * d;
    }
    const glow = g.createRadialGradient(W / 2, H * .82, 0, W / 2, H * .82, Math.max(W, H) * .6);
    glow.addColorStop(0, 'rgba(180,85,255,.3)'); glow.addColorStop(1, 'rgba(180,85,255,0)');
    g.fillStyle = glow; g.fillRect(0, 0, W, H);
  }
  function frame() {
    ctx.drawImage(bg, 0, 0);
    ctx.strokeStyle = 'rgba(200,210,255,.3)'; ctx.lineWidth = d;
    ctx.beginPath();
    for (const p of drops) {
      ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.l * .18, p.y + p.l);
      p.y += p.v; p.x -= p.v * .18;
      if (p.y > H) { p.y = -p.l; p.x = Math.random() * (W + 60 * d); }
    }
    ctx.stroke();
    raf = alley.inert ? 0 : requestAnimationFrame(frame);
  }
  function resize() {
    const b = c.getBoundingClientRect();
    if (!b.width || !b.height) return;
    d = Math.min(window.devicePixelRatio || 1, 2);
    W = c.width = Math.round(b.width * d); H = c.height = Math.round(b.height * d);
    paintBg();
    drops = Array.from({ length: Math.round(b.width / 8) }, () => ({ x: Math.random() * W, y: Math.random() * H, l: (9 + Math.random() * 15) * d, v: (8 + Math.random() * 7) * d }));
    cancelAnimationFrame(raf);
    if (reduced) { ctx.drawImage(bg, 0, 0); raf = 0; } else raf = requestAnimationFrame(frame);
  }
  new ResizeObserver(resize).observe(c);
  // 부스에서 골목으로 돌아오면 비를 다시 돌린다
  new MutationObserver(() => { if (!alley.inert && !raf && !reduced && bg) raf = requestAnimationFrame(frame); }).observe(alley, { attributes: true, attributeFilter: ['aria-hidden'] });
})();
})();
</script>
