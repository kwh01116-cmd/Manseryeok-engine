<title>달무리 골목</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Jua&family=Noto+Serif+KR:wght@700&display=swap">
<style>
/* Layout: a full-bleed 3D night alley (three.js). HTML only carries the title card,
   the booth plate, and the dialogue panel that sits under the seated camera. */
:root {
  color-scheme: dark;
  --night: #0b0919;
  --ink: #150e28;
  --violet: #b455ff;
  --lime: #e6ff3d;
  --bulb: #ffd98a;
  --red: #e8322f;
  --paper: #fff4dc;
  --gold: #e2b659;
  --f-sign: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-label: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--night); color: var(--paper); font-family: var(--f-body); overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.stage { position: relative; height: 100%; min-height: 540px; overflow: hidden; container-type: size; background: var(--night); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.lens { /* 큰 판형 렌즈 느낌: 가장자리 광량 저하 */
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 95% at 50% 46%, transparent 52%, rgba(4, 3, 12, .5) 100%);
}
.loading {
  position: absolute; inset: 0; z-index: 9;
  display: grid; place-items: center;
  padding: 24px; text-align: center;
  background: var(--night);
  font-family: var(--f-label); font-size: 18px; color: var(--bulb);
  transition: opacity .8s ease;
}
.loading.done { opacity: 0; pointer-events: none; }

/* 골목 UI */
.alley-ui { position: absolute; inset: 0; pointer-events: none; transition: opacity .5s ease; }
.alley-ui[hidden] { display: block !important; opacity: 0; visibility: hidden; }
.alley-ui > * { pointer-events: auto; }
.title { position: absolute; left: 0; top: clamp(14px, 3cqh, 30px); pointer-events: none; }
.title h1 {
  margin: 0;
  font-family: var(--f-sign); font-weight: 400;
  font-size: clamp(30px, 6.4cqw, 58px); line-height: 1.05;
  color: var(--lime);
  text-shadow: 0 0 18px rgba(180, 85, 255, .9), 0 2px 0 #1a1160;
}
.title p { margin: 6px 0 0; font-family: var(--f-label); font-size: clamp(14px, 2.2cqw, 17px); color: var(--bulb); text-shadow: 0 1px 6px #000; }
.plate {
  position: absolute; left: 0; right: 0;
  bottom: max(34px, calc(env(safe-area-inset-bottom, 0px) + 30px));
  display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap;
  pointer-events: none;
}
.plate > * { pointer-events: auto; }
.plate .name {
  min-width: 9.5em; padding: 9px 14px 7px;
  border-radius: 10px; border: 2px solid #d79bff;
  background: rgba(42, 26, 154, .9);
  font-family: var(--f-sign); font-size: 20px; line-height: 1; text-align: center; color: var(--lime);
  box-shadow: 0 0 18px rgba(180, 85, 255, .6);
}
.round {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1.5px solid rgba(255, 244, 220, .55); background: rgba(21, 14, 40, .8);
  font-size: 18px; line-height: 1;
}
.go {
  min-height: 44px; padding: 9px 20px 7px; border-radius: 999px; border: 0;
  background: var(--lime); color: var(--ink);
  font-family: var(--f-label); font-size: 18px;
  box-shadow: 0 0 18px rgba(230, 255, 61, .65);
}
.proto {
  position: absolute; left: 0; right: 0; bottom: max(8px, env(safe-area-inset-bottom, 0px));
  margin: 0; font-size: 12px; text-align: center; color: rgba(255, 244, 220, .66); text-shadow: 0 1px 4px #000; pointer-events: none;
}

/* 부스 안 UI */
.room-ui { position: absolute; inset: 0; pointer-events: none; transition: opacity .5s ease; }
.room-ui[hidden] { display: block !important; opacity: 0; visibility: hidden; }
.room-ui > * { pointer-events: auto; }
.hud {
  position: absolute; left: 0; right: 0; top: max(8px, env(safe-area-inset-top, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none;
}
.hud > * { pointer-events: auto; }
.pill {
  padding: 8px 13px 7px; border-radius: 999px;
  border: 1.5px solid rgba(255, 244, 220, .5); background: rgba(21, 14, 40, .78);
  font-family: var(--f-label); font-size: 14px; line-height: 1;
}
.pill:hover { background: rgba(21, 14, 40, .95); border-color: var(--paper); }
.chip {
  padding: 6px 12px 5px; border-radius: 8px;
  background: rgba(255, 244, 220, .94); color: var(--ink);
  font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 16px; letter-spacing: .12em; line-height: 1.2;
}
.dlg-wrap { position: absolute; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.dlg {
  position: relative; pointer-events: auto;
  max-width: 680px; min-height: clamp(120px, 18cqh, 160px);
  margin: 0 auto; padding: 26px 18px 16px;
  border-radius: 14px; border: 1.5px solid rgba(226, 182, 89, .6);
  background: rgba(21, 14, 40, .9);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
}
.who {
  position: absolute; left: 14px; top: -15px;
  padding: 3px 12px 2px; border-radius: 7px;
  background: var(--lime); color: var(--ink);
  font-family: var(--f-sign); font-size: 18px;
  transform: rotate(-2deg); box-shadow: 0 0 14px rgba(230, 255, 61, .5);
}
.line { margin: 0; min-height: 3.2em; font-size: clamp(16px, 2.3cqw, 18px); line-height: 1.62; word-break: keep-all; overflow-wrap: anywhere; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.next {
  position: absolute; right: 10px; bottom: 6px; padding: 6px 8px;
  border: 0; background: none; color: var(--lime); font-size: 15px;
  animation: nudge 1s ease-in-out infinite;
}
@keyframes nudge { 50% { transform: translateY(4px); } }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.opts:empty { display: none; }
.opt {
  min-height: 44px; padding: 8px 10px 7px;
  border-radius: 11px; border: 2px solid var(--ink);
  font-family: var(--f-label); font-size: 16px; line-height: 1.15; color: var(--ink);
  box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .5), 0 0 12px rgba(255, 255, 255, .18);
  transition: transform .15s ease;
}
.opt:hover { transform: translateY(-2px); }
.opt:nth-child(4n+1) { background: #ffee4d; }
.opt:nth-child(4n+2) { background: var(--red); color: #fff; }
.opt:nth-child(4n+3) { background: #f4f7ff; }
.opt:nth-child(4n+4) { background: #b23cf0; color: #fff; }
.ask { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask input {
  flex: 1 1 180px; min-width: 0; min-height: 44px; padding: 8px 10px;
  border-radius: 11px; border: 2px solid var(--gold);
  background: var(--paper); color: var(--ink); font-size: 16px;
}
.ask .opt { flex: 0 0 auto; }
.birth { grid-column: 1 / -1; display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
.birth label { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-family: var(--f-label); font-size: 13px; color: var(--bulb); }
.birth input, .birth select {
  width: 100%; min-width: 0; min-height: 44px; padding: 8px 8px;
  border-radius: 11px; border: 2px solid var(--gold);
  background: var(--paper); color: var(--ink); font-size: 16px;
}
.birth .wide { grid-column: span 2; }
.birth .checks { grid-column: 1 / -1; }
.birth .checks label { flex-direction: row; align-items: center; gap: 8px; font-size: 15px; color: var(--paper); }
.birth .checks input { width: 20px; height: 20px; min-height: 0; padding: 0; accent-color: #b23cf0; }
.birth .opt { grid-column: 1 / -1; }
.count { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0; font-family: var(--f-label); font-size: 14px; color: var(--bulb); }
.count button { padding: 6px 12px 5px; border-radius: 999px; border: 1.5px solid var(--bulb); background: none; font-size: 14px; }
.sugs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.sugs .opt { flex: 1 1 auto; min-height: 40px; font-size: 15px; }
.line.wait { color: var(--bulb); font-size: 26px; letter-spacing: .2em; animation: breathe 1.2s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .35; } }
.opts .solo { grid-column: 1 / -1; }

/* ── 레포트 (봉투를 열면) ── */
.report { position: absolute; inset: 0; z-index: 20; display: flex; justify-content: center; align-items: center; padding: 12px; background: rgba(8, 6, 18, .72); }
.report[hidden] { display: none; }
.sheet {
  position: relative; width: 100%; max-width: 680px; max-height: 100%; overflow-y: auto; overscroll-behavior: contain;
  padding: 26px clamp(16px, 4cqw, 34px) 0; border-radius: 6px;
  background: #fbf3dc repeating-linear-gradient(transparent 0 31px, rgba(140, 110, 60, .1) 31px 32px);
  color: var(--ink); box-shadow: 0 18px 50px rgba(0, 0, 0, .6);
  font-size: 15.5px; line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere;
}
.sheet h2 { margin: 2px 0 4px; font-family: var(--f-sign); font-weight: 400; font-size: 26px; line-height: 1.25; color: #3a1466; }
.sheet h3 { margin: 22px 0 6px; font-family: var(--f-label); font-weight: 400; font-size: 18px; color: #b3202f; }
.sheet p { margin: 0 0 8px; }
.rep-k, .rep-meta { font-family: var(--f-label); font-size: 13px; color: #7a6845; }
.rep-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 420px; margin: 16px auto 6px; }
.rep-card { margin: 0; text-align: center; font-family: var(--f-label); font-size: 13px; line-height: 1.3; color: #5a4a2c; }
.rep-face { display: grid; place-items: center; aspect-ratio: 256 / 420; margin-bottom: 6px; border: 5px solid var(--gold); border-radius: 6px; background: var(--paper); }
.rep-face svg { width: 70%; height: auto; }
.rep-card.rev svg { transform: rotate(180deg); }
.rep-card b { display: block; font-weight: 400; font-size: 15px; color: #231a70; }
.head-line { font-family: var(--f-label); font-size: 19px; line-height: 1.5; color: #231a70; }
.basis { display: block; font-family: var(--f-label); font-size: 12.5px; line-height: 1.4; color: #8a6a2c; }
.quote { margin: 0 0 8px; padding: 8px 12px; border-left: 4px solid var(--gold); background: rgba(226, 182, 89, .16); font-family: var(--f-label); }
.sheet ul { margin: 0; padding-left: 20px; }
.rep-foot { margin: 22px 0 0 !important; padding-top: 10px; border-top: 1px dashed #b9ab88; font-size: 13px; color: #6b5b3a; }
.rep-act { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px -4px 0; padding: 10px 4px 14px; background: linear-gradient(transparent, #fbf3dc 30%); }
.rep-act .opt { flex: 1 1 120px; }
.rep-msg { flex: 1 1 100%; font-size: 13px; color: #6b5b3a; }
.rep-msg:empty { display: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01s !important; }
}
</style>

<div class="stage" id="stage">
  <canvas id="gl" aria-label="비 오는 밤, 사주·타로 부스가 늘어선 골목"></canvas>
  <div class="lens"></div>

  <div class="alley-ui" id="alleyUi" hidden>
    <header class="title gutter">
      <h1>달무리 골목</h1>
      <p>불 켜진 부스의 비닐을 걷고 들어가 앉아 보세요</p>
    </header>
    <div class="plate gutter">
      <button class="round" id="prev" type="button" aria-label="왼쪽 부스">◀</button>
      <span class="name" id="plateName" aria-live="polite">달무리 타로</span>
      <button class="round" id="nextBooth" type="button" aria-label="오른쪽 부스">▶</button>
      <button class="go" id="go" type="button">들어가기</button>
    </div>
    <p class="proto gutter">프로토타입 · 타로는 Claude와 대화(안 되면 고정 대본), 사주·별자리는 고정 대본, 목소리는 브라우저 기본 음성 · 사주 계산은 Manseryeok-engine</p>
  </div>

  <div class="room-ui" id="roomUi" hidden>
    <div class="hud gutter">
      <button class="pill" id="exit" type="button">← 골목으로</button>
      <span class="chip" id="chip" hidden></span>
      <button class="pill" id="sound" type="button" aria-pressed="true">소리 켬</button>
    </div>
    <div class="dlg-wrap gutter">
      <div class="dlg" id="dlg">
        <span class="who" id="who">달무리</span>
        <p class="line" id="line" aria-hidden="true"></p>
        <p class="sr" id="live" aria-live="polite"></p>
        <div class="opts" id="opts"></div>
        <button class="next" id="next" type="button" aria-label="다음" hidden>▼</button>
      </div>
    </div>
  </div>

  <section class="report" id="report" role="dialog" aria-modal="true" aria-labelledby="repTitle" hidden>
    <div class="sheet" id="sheet" tabindex="-1">
      <p class="rep-k">달무리 타로 · 봉투 속 풀이</p>
      <h2 id="repTitle"></h2>
      <p class="rep-meta" id="repMeta"></p>
      <div class="rep-cards" id="repCards"></div>
      <div id="repBody"></div>
      <p class="rep-foot">재미로 보는 풀이예요. 카드는 지금 서 있는 자리를 비춰 줄 뿐 정해진 앞날을 알려 주지 않아요. 건강, 법, 돈에 관한 중요한 결정은 꼭 전문가와 상의하세요.</p>
      <div class="rep-act">
        <button class="opt" id="repCopy" type="button">글자 복사</button>
        <button class="opt" id="repClose" type="button">닫기</button>
        <span class="rep-msg" id="repMsg" aria-live="polite"></span>
      </div>
    </div>
  </section>

  <div class="loading" id="loading">골목 불 켜는 중…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const p2 = n => String(n).padStart(2, '0');
function termEvents(fromYear, toYear) {
  const map = new Map();
  for (let y = fromYear - 1; y <= toYear + 1; y++) {
    const table = Lunar.fromYmd(y, 6, 1).getJieQiTable();
    for (const k of Object.keys(table)) {
      const code = TERM_NAME[k]; if (!code) continue;
      const s = table[k];
      // 라이브러리 시각은 UTC+8. 한 시간 더해 한국 표준시로, 초는 분으로 반올림.
      const t = new Date(Date.UTC(s.getYear(), s.getMonth() - 1, s.getDay(), s.getHour() + 1, s.getMinute(), s.getSecond() + 30));
      map.set(t.getUTCFullYear() + ':' + code, { term: code, displayedDateTime: `${t.getUTCFullYear()}-${p2(t.getUTCMonth() + 1)}-${p2(t.getUTCDate())}T${p2(t.getUTCHours())}:${p2(t.getUTCMinutes())}`, timeBasis: 'KST', sourcePrecision: 'MINUTE', sourceIds: ['OSS-LUNAR-JAVASCRIPT-1.7.7'] });
    }
  }
  return [...map.values()].filter(e => { const y = +e.displayedDateTime.slice(0, 4); return y >= fromYear && y <= toYear; })
    .sort((a, b) => a.displayedDateTime < b.displayedDateTime ? -1 : 1);
}
const TG_KO = { '比肩': '비견', '劫財': '겁재', '食神': '식신', '傷官': '상관', '偏財': '편재', '正財': '정재', '七殺': '편관', '正官': '정관', '偏印': '편인', '正印': '정인' };

function computeSaju(b) {
  if (typeof ManseEngine === 'undefined' || typeof Lunar === 'undefined') throw new Error('engine-missing');
  let y = b.y, m = b.m, d = b.d;
  if (b.lunar) {
    try { const s = Lunar.fromYmd(y, b.leap ? -m : m, d).getSolar(); y = s.getYear(); m = s.getMonth(); d = s.getDay(); }
    catch (e) { return null; }
  } else {
    const t = new Date(Date.UTC(y, m - 1, d));
    if (t.getUTCFullYear() !== y || t.getUTCMonth() !== m - 1 || t.getUTCDate() !== d) return null;
  }
  const minute = `${y}-${p2(m)}-${p2(d)}T${b.known ? p2(b.hh) + ':' + p2(b.mm) : '12:00'}`;
  const chart = ManseEngine.chart(termEvents(y - 1, y + 1), minute, b.known);
  const pillars = [['시', chart.hour], ['일', chart.day], ['월', chart.month], ['년', chart.year]];
  const elc = { WOOD: 0, FIRE: 0, EARTH: 0, METAL: 0, WATER: 0 };
  const grp = { 비겁: 0, 식상: 0, 재성: 0, 관성: 0, 인성: 0 };
  for (const [, p] of pillars) {
    if (!p) continue;
    elc[p.stemElement]++; elc[p.branchElement]++;
    if (p.stemTenGod) grp[TG_GROUP[p.stemTenGod]]++;
    if (p.branchTenGod) grp[TG_GROUP[p.branchTenGod]]++;
  }
  const now = new Date();
  const luckYear = now.getMonth() >= 9 ? now.getFullYear() + 1 : now.getFullYear();
  return { chart, pillars, el: elc, grp, solar: { y, m, d }, input: b, old: y < 1989,
    luck: ManseEngine.annual(chart.dayMaster, luckYear), luckIsNext: luckYear !== now.getFullYear() };
}

}
async function writeReport() {

  const a = llm(prompt('레포트 앞부분', `상담이 끝났다. 손님에게 건넬 풀이 레포트의 앞부분을 쓴다. 달무리 말투를 유지하되 글로 읽히게 쓴다.

앞부분 전체 1,000~1,800자. ${BASIS_HOW}`, REP_A_FMT), 'complex');
  const b = llm(prompt('레포트 뒷부분', `상담이 끝났다. 손님에게 건넬 풀이 레포트의 뒷부분을 쓴다. 달무리 말투를 유지하되 글로 읽히게 쓴다.
cautions: 조심할 것 정확히 3개. quote: 상담에서 손님이 한 말 하나를 그대로 인용하고 그 말을 짚은 한마디. next: 다음에 물어보면 좋은 것 2~3개.
뒷부분 전체 800~1,500자. ${BASIS_HOW}`, REP_B_FMT), 'complex');
  const both = Promise.all([a, b]); both.catch(() => {}); both.abort = () => { a.abort(); b.abort(); };
  const got = await pondering(both, '오늘 얘기 종이에 적는 중이에요…', '기다리기 힘들면 짧게 받기');

}

  let day;
  for (let tries = 0; ; tries++) {
    day = await askDay(tries ? '다시 알려 주세요.' : '생일이 몇 월 며칠이에요? 양력으로요.', 'neutral');
    if (day.d <= DAYS_IN[day.m - 1]) break;
    await say('그 날짜는 달력에 없네요.', 'surprise');
  }
  b.reader.look = 1;
  type('잠깐만요. 그날 해가 어디 있었는지 볼게요…', 'think').catch(() => {});
  const mine = sunSign(day.m, day.d), today = new Date(), now = sunSign(today.getMonth() + 1, today.getDate()).idx;
  const sign = SIGNS[mine.idx], elem = ELS[mine.idx % 4];
  await sleep(1300);
  chip.textContent = `태양 ${sign.n}`; chip.hidden = false;
  starPaper(mine.idx, now);
  await cut(() => shotTable(b, .6, 0, .37), 1.3);
  await say(sign.line, 'neutral');
  if (mine.cusp) await say('다만 별자리가 바뀌는 경계에 걸친 날이에요. 태어난 해와 시간에 따라 옆 별자리일 수도 있어요.', 'think');
  b.reader.look = 0;
  await cut(seat, 1.1);
  await say(`${elem.line} 그중에서도 ${MODES[mine.idx % 3]}`, 'smile');
  await say(transitLine(mine.idx, now), 'think');
  for (let asked = 0; ; asked++) {
    const opts = [['연애', 'love'], ['일 · 진로', 'work'], ['돈', 'money']];
    if (asked) opts.push(['이제 됐어요', 'done']);
    const q = await choose(asked ? '더 궁금한 게 있어요?' : '어떤 게 제일 궁금하세요?', opts, 'neutral');
    if (q === 'done') break;
    await say(elem[q], q === 'love' ? 'smile' : 'neutral');
  }
  await say('오늘은 태양 별자리만 봤어요. 달 별자리와 상승궁은 태어난 시간과 장소가 있어야 하는데, 그건 아직 준비 중이에요.', 'neutral');
  await say('별은 길을 정해 주지 않아요. 어느 쪽이 밝은지만 알려 주죠. 복채는 괜찮아요, 아직 개업 전이라서요.', 'smile');
}

/* ═════════ 장면 전환 ═════════ */
const show = (node, on) => { node.hidden = !on; node.inert = !on; };
function setFocus(i, quiet) {
  i = clamp(i, 0, BOOTHS.length - 1);
  if (state.mode !== 'alley' || i === state.focus) return;
  state.focus = i; plateName.textContent = BOOTHS[i].name;
  if (!quiet) Sfx.step();
  move([shotAlley()], aspect >= 1.5 ? .9 : 1.6).catch(() => {});     // 옆 부스로 트래킹
}
async function intro() {
  state.mode = 'intro';
  const end = shotAlley();
  rig.pos.set(end.pos.x + 3.5, 8.5, end.pos.z + 9); rig.look.set(end.look.x, 3.2, 0); rig.fov = end.fov + 6;
  $('#loading').classList.add('done');
  try {      // 지붕 위에서 크레인으로 내려와 골목 정면에 선다
    await move([{ pos: V(end.pos.x + 1.2, 3.4, end.pos.z + 3), look: V(end.look.x, 2.6, 0), fov: end.fov + 3 }, end], 5.2);
    state.mode = 'alley'; show(alleyUi, true);
  } catch (e) { if (!(e instanceof Stop)) throw e; }
}
async function enter(i) {
  if (state.mode !== 'alley') return;
  cancelAll(); fxList.length = 0;
  const b = BOOTHS[i], ex = b.x + CX, seat = shotSeat(b);
  state.mode = 'moving'; state.focus = i; state.inside = i; state.shot = () => shotSeat(b);
  plateName.textContent = b.name;
  show(alleyUi, false); canvas.style.cursor = '';
  Sfx.start(); Voice.tone(b.voice[0], b.voice[1]);
  activeReader = b.reader; whoEl.textContent = b.who; chip.hidden = true;
  lineEl.textContent = ''; optsEl.replaceChildren(); nextBtn.hidden = true; clearTable();
  Table.group.position.set(ex, 0, 0);
  let swished = false, inside = false;
  try {
    // 걸어가서, 비닐을 걷고, 발판을 딛고 올라, 의자에 앉는다
    await move([
      { pos: V(ex, 1.6, 3.4), look: V(ex, 1.62, -1.7), fov: seat.fov - 6 },
      { pos: V(ex, 1.7, .9), look: V(ex, 1.6, -1.7), fov: seat.fov - 2 },
      { pos: V(ex, 1.93, .08), look: V(ex, 1.5, -1.72), fov: seat.fov },
      seat,
    ], 5.6, { bob: .02, on: (e) => {
      b.open = smooth(.42, .74, e);
      if (e > .42 && !swished) { swished = true; Sfx.swish(); }
      if (e > .74 && !inside) { inside = true; Sfx.inside(true); Sfx.step(); }
    } });
    state.mode = 'room'; show(roomUi, true);
    await sleep(350);
    await ({ tarot: tarotSession, saju: sajuSession, star: starSession })[b.id](b);
    leave();
  } catch (e) { if (!(e instanceof Stop)) throw e; }
}
async function leave() {
  if (state.mode !== 'room') return;
  cancelAll(); Voice.stop(); fxList.length = 0;
  const b = BOOTHS[state.inside], ex = b.x + CX;
  state.mode = 'moving'; show(roomUi, false);
  b.reader.look = 0; b.reader.setMood('smile'); b.reader.talking = false; activeReader = null;
  Sfx.swish(); Sfx.inside(false);
  try {
    await move([{ pos: V(ex, 1.8, .7), look: V(ex, 1.55, -1.7), fov: 50 }, shotAlley()], 3.2, { bob: .012, on: e => { b.open = 1 - smooth(.5, .85, e); } });
    b.open = 0; clearTable(); state.inside = -1; state.mode = 'alley'; show(alleyUi, true);
    $('#go').focus({ preventScroll: true });
  } catch (e) { if (!(e instanceof Stop)) throw e; }
}

$('#go').addEventListener('click', () => enter(state.focus));
$('#prev').addEventListener('click', () => setFocus(state.focus - 1));
$('#nextBooth').addEventListener('click', () => setFocus(state.focus + 1));
$('#exit').addEventListener('click', leave);
nextBtn.addEventListener('click', e => { e.stopPropagation(); advance(); });
dlg.addEventListener('click', e => { if (!e.target.closest('button, input, select, label, form')) advance(); });
document.addEventListener('keydown', e => {
  if (e.target.closest('button, input, select, form')) return;
  if (state.mode === 'alley') {
    if (e.key === 'ArrowLeft') setFocus(state.focus - 1); else if (e.key === 'ArrowRight') setFocus(state.focus + 1); else if (e.key === 'Enter') enter(state.focus);
  } else if (state.mode === 'room' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); advance(); }
});
function paintSound() { soundBtn.textContent = Voice.on ? '소리 켬' : '소리 끔'; soundBtn.setAttribute('aria-pressed', String(Voice.on)); }
soundBtn.addEventListener('click', () => { Voice.set(!Voice.on); Sfx.mute(!Voice.on); paintSound(); });
paintSound();
show(alleyUi, false); show(roomUi, false);

/* ═════════ 시작 ═════════ */
async function boot() {
  const loading = $('#loading');
  if (!T) { loading.textContent = '3D 엔진(three.js)을 불러오지 못했어요. 네트워크를 확인하고 다시 열어 주세요.'; return; }
  // 간판과 종이는 캔버스에 글자를 그리므로 글꼴이 먼저 와 있어야 한다
  const sample = '달무리보름타로사주궁합전문신점연애진로속마음평생수택일고민한장이면커플상담시손금무료재회운정통봐드림년세복채안내원카드이체가능노래방호프소포차약월일간나모름양력음윤달시지비견겁재식상편정관인계산절기바보마법여제황교연전차힘은둔자의레퀴매린람죽절악탑별태심판계샛별출생차트점성내이번흐름양황소쌍둥게처녀천칭갈염물병고기불흙바람태지금해부터시작하키꾸간이OK!!·0123456789';
  try {
    await Promise.race([
      Promise.all(['48px "Black Han Sans"', '48px "Jua"', '24px "Gowun Dodum"'].map(f => document.fonts.load(f, sample))
        .concat(document.fonts.load('700 48px "Noto Serif KR"', '四柱八字萬歲曆甲乙丙丁戊己庚辛壬癸子丑寅卯辰巳午未申酉戌亥木火土金水中國語日本'))),
      new Promise(r => setTimeout(r, 4000)),
    ]);
  } catch (e) { /* 글꼴 없이도 기본 글꼴로 그린다 */ }
  loading.textContent = '상담사 모시는 중…';
  W.sprites = await loadSprites();
  try { buildWorld(); }
  catch (e) { console.warn(e); loading.textContent = '이 브라우저에서는 3D 화면을 열 수 없어요. (WebGL 필요)'; return; }
  new ResizeObserver(resize).observe(stage);
  resize();
  renderer.setAnimationLoop(frame);
  intro();
}
boot();
})();
</script>
